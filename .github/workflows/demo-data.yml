# Records the offline demo ("Try demo account" in the app) from a real server run and
# commits it to mobile/assets/demo/demo.json. Run it after changing the demo script or the API.
name: Demo data

on:
  push:
    branches: [main]
    paths: ['backend/test/e2e/demo-record.js', 'backend/test/e2e/demo-assets/**', '.github/workflows/demo-data.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: chat
          POSTGRES_PASSWORD: chat
          POSTGRES_DB: chatapp
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U chat" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Record demo
        working-directory: backend
        env:
          DATABASE_URL: postgres://chat:chat@localhost:5432/chatapp
          OTP_DEV_MODE: 'true'
          JWT_SECRET: demo-user-secret-0123456789abcdef
          ADMIN_JWT_SECRET: demo-admin-secret-0123456789abcdef
          OTP_SECRET: demo-otp-secret-0123456789abcdef
          PUBLIC_URL: http://localhost:4000
          PORT: '4000'
        run: |
          npm install --no-audit --no-fund --omit=optional 2>&1 | tail -3
          node scripts/migrate.js
          nohup node src/server.js > /tmp/server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:4000/health && break; sleep 1; done
          OUT=../mobile/assets/demo/demo.json node test/e2e/demo-record.js || (tail -50 /tmp/server.log; exit 1)
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add mobile/assets/demo/demo.json
          git diff --cached --quiet && exit 0
          git commit -m "Update offline demo data"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && break; sleep 5; done
