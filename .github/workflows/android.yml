# Builds the Talvio Android app (APK) on every push to main, or by hand from the Actions tab.
# Set the server address once: repo → Settings → Secrets and variables → Actions → Variables → API_BASE
# (e.g. https://chat.yourdomain.com). Without it the APK points at the Android emulator (10.0.2.2:4000).
name: Android APK

on:
  push:
    branches: [main]
    paths: ['mobile/**', '.github/workflows/android.yml']
  workflow_dispatch:
    inputs:
      analyze_only:
        description: Only check the code (no APK)
        type: boolean
        default: false

permissions:
  contents: write  # lets the job save its error report to the ci-logs branch

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Free disk space
        working-directory: /
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/node_modules /opt/ghc /usr/local/.ghcup \
            /usr/local/share/boost /usr/local/share/powershell /usr/share/swift /opt/hostedtoolcache/CodeQL \
            /usr/local/lib/android/sdk/ndk/2[0-6]* /usr/local/lib/android/sdk/emulator || true
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h /

      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate android/ folder
        env:
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          flutter --version
          flutter create . --org com.talvio --project-name chatapp --platforms=android
          rm -f test/widget_test.dart  # template test for the default counter app
          # release signing with the encrypted upload key (see android-key.yml); debug key otherwise
          if [ -n "$KEY_PASS" ] && [ -f signing/upload-keystore.jks.enc ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in signing/upload-keystore.jks.enc -out android/upload.jks -pass env:KEY_PASS
            printf 'storeFile=upload.jks\nstorePassword=%s\nkeyAlias=upload\nkeyPassword=%s\n' "$KEY_PASS" "$KEY_PASS" > android/key.properties
            echo "SIGNED=release" >> $GITHUB_ENV
          else
            echo "SIGNED=debug" >> $GITHUB_ENV
          fi
          # push notifications: Firebase config from the GOOGLE_SERVICES_JSON secret (optional)
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json; fi
          dart run tool/patch_platforms.dart
          # keep Gradle within the runner's memory (the default -Xmx8G can get the runner killed)
          sed -i '/org.gradle.jvmargs/d' android/gradle.properties
          printf '%s\n' 'org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g' 'org.gradle.workers.max=2' 'kotlin.daemon.jvmargs=-Xmx1g' >> android/gradle.properties
          sed -n '/buildTypes/,/^    }/p' android/app/build.gradle* || true

      - name: Get packages
        run: flutter pub get

      - name: Analyze (errors only)
        id: analyze
        continue-on-error: true
        run: |
          mkdir -p ../ci-report
          set -o pipefail
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee ../ci-report/analyze.txt

      - name: Build APK
        id: build
        if: steps.analyze.outcome == 'success' && !inputs.analyze_only
        continue-on-error: true
        run: |
          set -o pipefail
          DEFINES="--dart-define=API_BASE=${{ vars.API_BASE || 'http://10.0.2.2:4000' }} --build-number=${{ github.run_number }}"
          { flutter build apk --release --split-per-abi --target-platform android-arm64,android-x64 $DEFINES &&
            { [ "$SIGNED" != release ] || flutter build appbundle --release $DEFINES; }; rc=$?; df -h /; exit $rc; } 2>&1 | tail -400 | tee ../ci-report/build.txt

      - name: Save report to ci-logs branch
        if: always()
        working-directory: .
        run: |
          mkdir -p ci-report
          echo "analyze=${{ steps.analyze.outcome }} build=${{ steps.build.outcome }} sha=${{ github.sha }}" > ci-report/status.txt
          cd ci-report
          git init -q -b ci-logs
          git config user.name ci && git config user.email ci@users.noreply.github.com
          git add -A && git commit -qm "CI report ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-logs

      - name: Publish APK to Releases (android-latest)
        if: steps.build.outcome == 'success'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp mobile/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk talvio.apk
          cp mobile/build/app/outputs/flutter-apk/app-x86_64-release.apk talvio-x86_64-emulator.apk
          FILES="talvio.apk talvio-x86_64-emulator.apk"
          if [ -f mobile/build/app/outputs/bundle/release/app-release.aab ]; then
            cp mobile/build/app/outputs/bundle/release/app-release.aab talvio-playstore.aab; FILES="$FILES talvio-playstore.aab"
          fi
          R="${{ github.repository }}"
          TITLE="Talvio Android (test build #${{ github.run_number }})"
          NOTES="Built from ${{ github.sha }} (signing: $SIGNED, build #${{ github.run_number }}). Server: ${{ vars.API_BASE || 'http://10.0.2.2:4000 (emulator only - set the API_BASE variable)' }}"
          for i in 1 2 3; do
            if gh release view android-latest -R "$R" >/dev/null 2>&1; then
              gh release upload android-latest $FILES --clobber -R "$R" &&
                gh release edit android-latest --title "$TITLE" --notes "$NOTES" --prerelease -R "$R" && exit 0
            else
              gh release create android-latest $FILES -R "$R" --target "${{ github.sha }}" \
                --prerelease --title "$TITLE" --notes "$NOTES" && exit 0
            fi
            echo "publish attempt $i failed, retrying"; sleep 15
          done
          exit 1

      - name: Fail if analyze or build failed
        if: steps.analyze.outcome != 'success' || (steps.build.outcome != 'success' && !inputs.analyze_only)
        run: exit 1
