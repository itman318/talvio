# Builds the Talvio Android app (APK) on every push to main, or by hand from the Actions tab.
# Set the server address once: repo → Settings → Secrets and variables → Actions → Variables → API_BASE
# (e.g. https://chat.yourdomain.com). Without it the APK points at the Android emulator (10.0.2.2:4000).
name: Android APK

on:
  push:
    branches: [main]
    paths: ['mobile/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write  # lets the job save its error report to the ci-logs branch

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate android/ folder
        run: |
          flutter --version
          flutter create . --org com.talvio --project-name chatapp --platforms=android
          dart run tool/patch_platforms.dart

      - name: Get packages
        run: flutter pub get

      - name: Analyze (errors only)
        id: analyze
        continue-on-error: true
        run: |
          mkdir -p ../ci-report
          set -o pipefail
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee ../ci-report/analyze.txt

      - name: Build APK
        id: build
        if: steps.analyze.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          { flutter build apk --release --split-per-abi \
              --dart-define=API_BASE=${{ vars.API_BASE || 'http://10.0.2.2:4000' }} &&
            flutter build apk --release \
              --dart-define=API_BASE=${{ vars.API_BASE || 'http://10.0.2.2:4000' }}; } 2>&1 | tail -400 | tee ../ci-report/build.txt

      - name: Save report to ci-logs branch
        if: always()
        working-directory: .
        run: |
          mkdir -p ci-report
          echo "analyze=${{ steps.analyze.outcome }} build=${{ steps.build.outcome }} sha=${{ github.sha }}" > ci-report/status.txt
          cd ci-report
          git init -q -b ci-logs
          git config user.name ci && git config user.email ci@users.noreply.github.com
          git add -A && git commit -qm "CI report ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-logs

      - uses: actions/upload-artifact@v4
        if: steps.build.outcome == 'success'
        with:
          name: talvio-android
          path: |
            mobile/build/app/outputs/flutter-apk/app-release.apk
            mobile/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            mobile/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          retention-days: 30

      - name: Fail if analyze or build failed
        if: steps.analyze.outcome != 'success' || steps.build.outcome != 'success'
        run: exit 1
