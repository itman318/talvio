# Builds the Hushavia Android app (APK) on every push to main, or by hand from the Actions tab.
# Set the server address once: repo → Settings → Secrets and variables → Actions → Variables → API_BASE
# (e.g. https://chat.yourdomain.com). Without it the APK points at the Android emulator (10.0.2.2:4000).
name: Android APK

on:
  push:
    branches: [main]
    paths: ['mobile/**', '.github/workflows/android.yml']
  workflow_dispatch:
    inputs:
      analyze_only:
        description: Only check the code (no APK)
        type: boolean
        default: false
      lib_from:
        description: Test only - take the app code (mobile/lib) from this commit
        default: ''
      tag:
        description: Release to publish to
        default: android-latest

permissions:
  contents: write  # lets the job save its error report to the ci-logs branch

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Free disk space
        working-directory: /
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/node_modules /opt/ghc /usr/local/.ghcup \
            /usr/local/share/boost /usr/local/share/powershell /usr/share/swift /opt/hostedtoolcache/CodeQL \
            /usr/local/lib/android/sdk/ndk/2[0-6]* /usr/local/lib/android/sdk/emulator || true
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h /

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Test build with older app code
        if: inputs.lib_from != ''
        working-directory: .
        run: git checkout ${{ inputs.lib_from }} -- mobile/lib && echo "app code from ${{ inputs.lib_from }}"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate android/ folder
        env:
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.SERVER_PASSWORD }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          flutter --version
          flutter create . --org com.hushavia --project-name chatapp --platforms=android
          rm -f test/widget_test.dart  # template test for the default counter app
          # release signing with the encrypted upload key (see android-key.yml); debug key otherwise
          if [ -n "$KEY_PASS" ] && [ -f signing/upload-keystore.jks.enc ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in signing/upload-keystore.jks.enc -out android/upload.jks -pass env:KEY_PASS
            printf 'storeFile=upload.jks\nstorePassword=%s\nkeyAlias=upload\nkeyPassword=%s\n' "$KEY_PASS" "$KEY_PASS" > android/key.properties
            echo "SIGNED=release" >> $GITHUB_ENV
          else
            # one fixed test key (instead of a new random one per build), so updates install over the old app
            cp signing/test-debug.keystore android/upload.jks
            printf 'storeFile=upload.jks\nstorePassword=android\nkeyAlias=androiddebugkey\nkeyPassword=android\n' > android/key.properties
            echo "SIGNED=test" >> $GITHUB_ENV
          fi
          # push notifications: Firebase config from the GOOGLE_SERVICES_JSON secret (optional)
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            # the Firebase file must list our app id; if it is still the old one, point it at the new id
            # (add the com.hushavia.app Android app in Firebase and update the secret for full push support)
            if ! grep -q '"com.hushavia.app"' android/app/google-services.json; then
              python3 - <<'PY'
          import json
          p = 'android/app/google-services.json'
          j = json.load(open(p))
          for c in j.get('client', []):
              c.setdefault('client_info', {}).setdefault('android_client_info', {})['package_name'] = 'com.hushavia.app'
          json.dump(j, open(p, 'w'))
          PY
              echo "FIREBASE_APP=old" >> $GITHUB_ENV
            fi
          fi
          dart run tool/patch_platforms.dart
          # keep Gradle within the runner's memory (the default -Xmx8G can get the runner killed)
          sed -i '/org.gradle.jvmargs/d' android/gradle.properties
          printf '%s\n' 'org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g' 'org.gradle.workers.max=2' 'kotlin.daemon.jvmargs=-Xmx1g' >> android/gradle.properties
          sed -n '/buildTypes/,/^    }/p' android/app/build.gradle* || true

      - name: Get packages
        run: flutter pub get

      - name: Analyze (errors only)
        id: analyze
        continue-on-error: true
        run: |
          mkdir -p ../ci-report
          set -o pipefail
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee ../ci-report/analyze.txt

      - name: Render mascot previews
        continue-on-error: true
        run: |
          mkdir -p ../ci-report/mascot
          MASCOT_OUT=$PWD/../ci-report/mascot flutter test test/mascot_preview_test.dart 2>&1 | tail -40 | tee ../ci-report/mascot.txt

      - name: Build APK
        id: build
        if: steps.analyze.outcome == 'success' && !inputs.analyze_only
        continue-on-error: true
        run: |
          set -o pipefail
          # tidy the address: no spaces, no trailing "/" or "/32" (a network mask copied with the IP)
          API="$(echo '${{ vars.API_BASE || 'http://10.0.2.2:4000' }}' | tr -d '[:space:]' | sed -E 's#/[0-9]{1,3}$##; s#/+$##')"
          case "$API" in http://*|https://*) ;; *) API="http://$API" ;; esac
          echo "API_BASE=$API" >> "$GITHUB_ENV"
          # version number 10000+ (the 64-bit APK becomes 12000+): always above older builds, so it updates over them
          DEFINES="--dart-define=API_BASE=$API --build-number=$((10000 + ${{ github.run_number }}))"
          # one small APK per phone type (like Telegram): 64-bit phones (almost all) get hushavia.apk,
          # older 32-bit Android gets hushavia-arm32.apk, the x86_64 one is only for the emulator.
          # debug symbols are kept out of the app (smaller download).
          { flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64,android-x64 --split-debug-info=build/symbols $DEFINES &&
            { [ "$SIGNED" != release ] || flutter build appbundle --release --split-debug-info=build/symbols $DEFINES; }; rc=$?; df -h /; exit $rc; } 2>&1 | tail -400 | tee ../ci-report/build.txt

      - name: Save report to ci-logs branch
        if: always()
        working-directory: .
        run: |
          mkdir -p ci-report
          echo "analyze=${{ steps.analyze.outcome }} build=${{ steps.build.outcome }} sha=${{ github.sha }}" > ci-report/status.txt
          cd ci-report
          git init -q -b ci-logs
          git config user.name ci && git config user.email ci@users.noreply.github.com
          git add -A && git commit -qm "CI report ${{ github.sha }}"
          # two builds at once can race here: a lost report must never stop the APK from being published
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-logs || { sleep 7; git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-logs; } || true

      - name: Publish APK to Releases
        if: steps.build.outcome == 'success'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp mobile/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk hushavia.apk
          cp mobile/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk hushavia-arm32.apk
          cp mobile/build/app/outputs/flutter-apk/app-x86_64-release.apk hushavia-x86_64-emulator.apk
          FILES="hushavia.apk hushavia-arm32.apk hushavia-x86_64-emulator.apk"
          if [ -f mobile/build/app/outputs/bundle/release/app-release.aab ]; then
            cp mobile/build/app/outputs/bundle/release/app-release.aab hushavia-playstore.aab; FILES="$FILES hushavia-playstore.aab"
          fi
          R="${{ github.repository }}"; TAG="${{ inputs.tag || 'android-latest' }}"
          TITLE="Hushavia Android (test build #${{ github.run_number }})"
          NOTES="Built from ${{ github.sha }} (signing: $SIGNED, build #${{ github.run_number }}). Server: ${API_BASE:-http://10.0.2.2:4000 (emulator only - set the API_BASE variable)}"
          for i in 1 2 3; do
            if gh release view "$TAG" -R "$R" >/dev/null 2>&1; then
              gh release upload "$TAG" $FILES --clobber -R "$R" &&
                gh release edit "$TAG" --title "$TITLE" --notes "$NOTES" --prerelease -R "$R" || { echo "publish attempt $i failed, retrying"; sleep 15; continue; }
              # files with the app's old name: remove them so only Hushavia files remain
              gh release view "$TAG" -R "$R" --json assets -q '.assets[].name' | grep -v '^hushavia' | while read -r old; do
                gh release delete-asset "$TAG" "$old" -y -R "$R" || true
              done || true
              exit 0
            else
              gh release create "$TAG" $FILES -R "$R" --target "${{ github.sha }}" \
                --prerelease --title "$TITLE" --notes "$NOTES" && exit 0
            fi
            echo "publish attempt $i failed, retrying"; sleep 15
          done
          exit 1

      - name: Fail if analyze or build failed
        if: steps.analyze.outcome != 'success' || (steps.build.outcome != 'success' && !inputs.analyze_only)
        run: exit 1
