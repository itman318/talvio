# Full app test: real backend + PostgreSQL on the runner, the Flutter app on an Android
# emulator logs in with the dev OTP, opens chats and sends a message. Screenshots → ci-app branch.
name: App e2e

on:
  push:
    branches: [main]
    paths: ['mobile/**', 'backend/**', '.github/workflows/app-e2e.yml', '.github/scripts/app-e2e.sh']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  e2e:
    runs-on: ubuntu-24.04  # pinned: the Android emulator needs the 24.04 image
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: chat
          POSTGRES_PASSWORD: chat
          POSTGRES_DB: chatapp
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U chat" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/node_modules /opt/ghc /usr/local/.ghcup \
            /usr/local/share/boost /usr/local/share/powershell /usr/share/swift /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h /

      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Start backend
        working-directory: backend
        env:
          DATABASE_URL: postgres://chat:chat@localhost:5432/chatapp
          OTP_DEV_MODE: 'true'
          JWT_SECRET: e2e-user-secret-0123456789abcdef
          ADMIN_JWT_SECRET: e2e-admin-secret-0123456789abcdef
          OTP_SECRET: e2e-otp-secret-0123456789abcdef
          PUBLIC_URL: http://10.0.2.2:4000
          PORT: '4000'
        run: |
          mkdir -p ../ci-app
          npm install --no-audit --no-fund --omit=optional 2>&1 | tail -3
          node scripts/migrate.js
          nohup node src/server.js > ../ci-app/server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:4000/health && break; sleep 1; done
          node test/e2e/seed-app.js seed

      - name: Prepare Android project
        working-directory: mobile
        run: |
          flutter create . --org com.talvio --project-name chatapp --platforms=android
          dart run tool/patch_platforms.dart
          rm -f test/widget_test.dart
          sed -i '/org.gradle.jvmargs/d' android/gradle.properties
          printf '%s\n' 'org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g' 'org.gradle.workers.max=2' 'kotlin.daemon.jvmargs=-Xmx1g' >> android/gradle.properties
          flutter pub get
          # build the test app now (before the emulator starts), then free the memory Gradle holds
          flutter build apk --debug --target=integration_test/app_test.dart --dart-define=API_BASE=http://10.0.2.2:4000 2>&1 | tail -5
          cp build/app/outputs/flutter-apk/app-debug.apk ../app-test.apk
          (cd android && ./gradlew --stop >/dev/null 2>&1 || true)
          pkill -f KotlinCompileDaemon || true
          free -m

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run app on emulator
        timeout-minutes: 40
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          ram-size: 3072M
          heap-size: 512M
          cores: 3
          disable-animations: true
          emulator-options: -no-window -gpu guest -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: bash .github/scripts/app-e2e.sh

      - name: Check the message reached the other user
        id: verify
        continue-on-error: true
        working-directory: backend
        run: |
          set -o pipefail
          node test/e2e/seed-app.js verify 2>&1 | tee ../ci-app/verify.txt

      - name: Save to ci-app branch
        if: always()
        run: |
          mkdir -p ci-app && cd ci-app
          echo "sha=${{ github.sha }} verify=${{ steps.verify.outcome }} $(cat drive_rc.txt 2>/dev/null)" > status.txt
          grep -q "drive_rc=0" drive_rc.txt && [ "${{ steps.verify.outcome }}" = success ] && echo ok > result.txt || echo fail > result.txt
          git init -q -b ci-app
          git config user.name ci && git config user.email ci@users.noreply.github.com
          git add -A && git commit -qm "app e2e ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-app

      - name: Fail if the app test failed
        if: always()
        run: grep -q ok ci-app/result.txt
