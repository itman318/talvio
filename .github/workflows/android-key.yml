# One-time: creates the Play Store *upload key* and stores it in the repo, encrypted with the
# ANDROID_KEY_PASSWORD secret (Settings → Secrets and variables → Actions). Run it from the
# Actions tab once. Keep that password safe — every release build needs it.
name: Create Android upload key

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  key:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Create and encrypt the upload key
        env:
          PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$PASS" ] || [ ${#PASS} -lt 8 ]; then echo "Set the ANDROID_KEY_PASSWORD secret (8+ characters) first"; exit 1; fi
          mkdir -p mobile/signing
          if [ -f mobile/signing/upload-keystore.jks.enc ]; then echo "An upload key already exists — not replacing it"; exit 0; fi
          keytool -genkeypair -v -keystore upload.jks -storetype PKCS12 -alias upload -keyalg RSA -keysize 4096 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" -dname "CN=Talvio, O=Talvio, C=PK"
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -in upload.jks -out mobile/signing/upload-keystore.jks.enc -pass env:PASS
          keytool -list -v -keystore upload.jks -storepass "$PASS" | grep -E "SHA1:|SHA256:" > mobile/signing/fingerprints.txt
          rm upload.jks
          git config user.name ci && git config user.email ci@users.noreply.github.com
          git add mobile/signing && git commit -m "Add encrypted Android upload key" && git push
