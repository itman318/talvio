# Checks the live server: endpoint timings, recent errors, outside connectivity. Result → ci-deploy branch (diagnose.txt).
name: Diagnose server

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Run checks on the server
        env:
          SSHPASS: ${{ secrets.SERVER_PASSWORD }}
          HOST: ${{ secrets.SERVER_HOST || vars.SERVER_HOST }}
          API_BASE: ${{ vars.API_BASE }}
        run: |
          HOST=$(echo "$HOST" | sed -E 's#^https?://##; s#[/:].*$##; s/[[:space:]]//g')
          if ! echo "$HOST" | grep -Eq '^[0-9]{1,3}(\.[0-9]{1,3}){3}$'; then HOST=$(echo "$API_BASE" | sed -E 's#^https?://##; s#[/:].*$##; s/[[:space:]]//g'); fi
          sudo apt-get install -y -qq sshpass >/dev/null
          SSH_OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=20 -o LogLevel=ERROR"
          sshpass -e scp $SSH_OPTS .github/scripts/diagnose.js root@"$HOST":/root/diagnose.js
          echo "from GitHub (US): health $(curl -s -o /dev/null -w '%{time_total}s' "http://$HOST/health")" > diag.txt
          echo "from GitHub: TURN tcp 3478 $(timeout 8 bash -c "</dev/tcp/$HOST/3478" 2>/dev/null && echo OPEN || echo CLOSED)" >> diag.txt
          sshpass -e ssh $SSH_OPTS root@"$HOST" 'bash -s' >> diag.txt 2>&1 <<'REMOTE'
          echo "--- server"
          uptime; free -m | head -2; df -h / | tail -1
          echo "--- outbound (DNS + https)"
          for h in api.brevo.com fcm.googleapis.com www.google.com; do
            echo "$h: $(curl -s -o /dev/null -w 'dns %{time_namelookup}s total %{time_total}s code %{http_code}' --max-time 15 https://$h/ || echo FAILED)"
          done
          echo "--- local endpoint timings"
          node /root/diagnose.js
          echo "--- database"
          sudo -u postgres psql -tAc "SELECT 'shared_buffers '||current_setting('shared_buffers')||' · db size '||pg_size_pretty(pg_database_size('hushavia'))" 2>&1
          sudo -u postgres psql -d hushavia -tAc "SELECT round(mean_exec_time::numeric,1)||' ms avg · '||calls||' calls · '||round(total_exec_time::numeric/1000,1)||' s total · '||left(regexp_replace(query, '\s+', ' ', 'g'), 110) FROM pg_stat_statements WHERE calls > 5 ORDER BY total_exec_time DESC LIMIT 12" 2>&1 | head -14
          echo "--- pages edited in the admin panel (these override the built-in text)"
          sudo -u postgres psql -d hushavia -tAc "SELECT slug||': '||length(body)||' chars, '||to_char(updated_at,'YYYY-MM-DD') FROM content_pages WHERE length(trim(body)) > 0" 2>&1
          echo "--- coin deposits"
          sudo -u postgres psql -d hushavia -tAc "SELECT 'xpub set: '||(length(coalesce(value#>>'{}',''))>100)::text FROM app_settings WHERE key='coins_deposit_xpub'" 2>&1
          sudo -u postgres psql -d hushavia -tAc "SELECT 'scanner at block '||last_block FROM coin_deposit_state" 2>&1
          sudo -u postgres psql -d hushavia -tAc "SELECT 'addresses '||count(*) FROM coin_deposit_addresses" 2>&1
          journalctl -u hushavia --since '-30 min' --no-pager 2>/dev/null | grep -i 'deposit' | tail -5
          echo "--- push notifications"
          journalctl -u hushavia --since "-2d" --no-pager | grep -i "push notifications" | tail -3
          echo "--- fast photos"
          (cd /opt/hushavia/app && node -e "try{const s=require('sharp');console.log('sharp: ok', s.versions.sharp)}catch(e){console.log('sharp: MISSING', e.message)}")
          sudo -u postgres psql -d hushavia -tAc "SELECT kind||' with thumb: '||count(*) FILTER (WHERE thumb IS NOT NULL)||' / '||count(*) FROM media WHERE kind IN ('image','video') GROUP BY kind" 2>/dev/null
          echo "ffmpeg: $(command -v ffmpeg >/dev/null && echo ok || echo MISSING)"
          sudo -u postgres psql -d hushavia -tAc "SELECT 'videos: id='||id||' mime='||mime||' size='||size_bytes||' failed='||thumb_failed||' thumb='||(thumb IS NOT NULL) FROM media WHERE kind='video' ORDER BY id DESC LIMIT 5" 2>/dev/null
          V=$(sudo -u postgres psql -d hushavia -tAc "SELECT storage_path FROM media WHERE kind='video' ORDER BY id DESC LIMIT 1" 2>/dev/null)
          [ -n "$V" ] && echo "newest video probe: $(ffprobe -v error -show_entries format=format_name,duration -of csv=p=0 "/var/lib/hushavia/uploads/$V" 2>&1 | head -c 200)"
          grep -n "uploadDir\|UPLOAD_DIR" /opt/hushavia/app/.env 2>/dev/null | sed 's/=.*/=…/' | head -2
          echo "app update: $(curl -s 'http://127.0.0.1:4000/api/app/update?build=1&abi=arm64-v8a' | head -c 300)"
          echo "--- recent upload / sticker requests (status, size)"
          grep -hE "POST /api/(media|stickers)" /var/log/nginx/access.log /var/log/nginx/access.log.1 2>/dev/null | tail -15 | awk '{print $4, $6, $7, $9, $10}'
          echo "--- logout check"
          echo "auth answers today (path status → count):"
          grep -hE "/api/auth/" /var/log/nginx/access.log 2>/dev/null | awk '{print $7, $9}' | sed -E 's/\?.*//; s/[0-9]{5,}/N/g' | sort | uniq -c | sort -rn | head -15
          echo "401/429 anywhere today:"
          awk '$9==401 || $9==429 {print $7, $9}' /var/log/nginx/access.log 2>/dev/null | sed -E 's/\?.*//; s/[0-9]{3,}/N/g' | sort | uniq -c | sort -rn | head -12
          echo "nginx limit hits: $(grep -c 'limiting requests' /var/log/nginx/error.log 2>/dev/null)"
          sudo -u postgres psql -d hushavia -tAc "SELECT 'sessions revoked 2d: '||count(*) FROM sessions WHERE revoked_at > now() - interval '2 days'" 2>&1
          sudo -u postgres psql -d hushavia -tAc "SELECT 'new sessions 2d: '||count(*) FROM sessions WHERE created_at > now() - interval '2 days'" 2>&1
          sudo -u postgres psql -d hushavia -tAc "SELECT user_id||' '||to_char(created_at,'MM-DD HH24:MI')||' revoked '||coalesce(to_char(revoked_at,'MM-DD HH24:MI'),'-')||' last '||to_char(last_active_at,'MM-DD HH24:MI') FROM sessions ORDER BY id DESC LIMIT 12" 2>&1
          journalctl -u hushavia --since "-1d" --no-pager | grep -iE "session|refresh|revok|logout" | tail -10 | cut -c1-200
          echo "--- push log"
          journalctl -u hushavia --since "-1d" --no-pager | grep -iE "push|firebase|fcm|messaging" | tail -15 | cut -c1-300
          echo "firebase pkg: $(cd /opt/hushavia/app && node -p "require('./node_modules/firebase-admin/package.json').version" 2>&1 | tail -1)"
          echo "sa file: $(ls -la /etc/hushavia/firebase.json 2>&1)"
          echo "push tokens: $(sudo -u postgres psql -d hushavia -tAc "SELECT count(*) FROM push_tokens" 2>&1)"
          echo "--- app crash reports (last 7 days, newest version first)"
          sudo -u postgres psql -d hushavia -tAc "SELECT app_version||' · '||platform||' · x'||count||' · '||users_count||' users · '||to_char(last_seen,'MM-DD HH24:MI')||' · '||left(regexp_replace(message, '\s+', ' ', 'g'), 160)||' @ '||left(regexp_replace(split_part(stack, E'\n', 1)||' | '||split_part(stack, E'\n', 2)||' | '||split_part(stack, E'\n', 3), '\s+', ' ', 'g'), 260) FROM client_errors WHERE resolved_at IS NULL AND last_seen > now() - interval '7 days' ORDER BY app_version DESC, count DESC LIMIT 25" 2>&1
          echo "--- calls (TURN)"
          echo "coturn: $(systemctl is-active coturn)"
          echo "listening 3478: udp=$(ss -ulnH | grep -c ':3478 ') tcp=$(ss -tlnH | grep -c ':3478 ')"
          echo "env: TURN_SECRET set=$(grep -c '^TURN_SECRET=.\+' /etc/hushavia/hushavia.env) · TURN_URLS=$(grep '^TURN_URLS=' /etc/hushavia/hushavia.env | cut -d= -f2-)"
          echo "firewall 3478: $(ufw status | grep -c 3478) rules · relay ports: $(ufw status | grep -cE '49160') rules"
          grep -E '^(listening-port|min-port|max-port|external-ip|realm|use-auth-secret)' /etc/turnserver.conf | tr '\n' ' '; echo
          S=$(grep '^TURN_SECRET=' /etc/hushavia/hushavia.env | cut -d= -f2-)
          IP=$(curl -s --max-time 5 https://api.ipify.org || hostname -I | awk '{print $1}')
          if command -v turnutils_uclient >/dev/null && [ -n "$S" ]; then
            echo "relay test (udp): $(timeout 25 turnutils_uclient -W "$S" -u test -n 2 -m 1 -l 100 -e "$IP" "$IP" 2>&1 | grep -iE 'success|error|lost|fail|allocate' | tail -3 | tr '\n' ' ')"
          fi
          journalctl -u coturn --since '-2d' --no-pager 2>/dev/null | grep -iE 'error|session.*closed|usage' | tail -5 | cut -c1-200
          echo "calls last 7d: $(sudo -u postgres psql -d hushavia -tAc "SELECT status||'='||count(*) FROM calls WHERE created_at > now() - interval '7 days' GROUP BY status" 2>&1 | tr '\n' ' ')"
          echo "--- security"
          echo "fail2ban: $(systemctl is-active fail2ban) · $(fail2ban-client status sshd 2>/dev/null | grep -E 'Currently banned|Total banned' | tr -s ' \t' ' ' | tr '\n' ' ')"
          echo "sandbox: $(systemctl show hushavia -p NoNewPrivileges -p ProtectSystem -p PrivateTmp | tr '\n' ' ')"
          echo "auto security updates: $(cat /etc/apt/apt.conf.d/20auto-upgrades 2>/dev/null | tr '\n' ' ')"
          echo "turn blocks localhost: $(grep -c 'denied-peer-ip=127' /etc/turnserver.conf)"
          echo "hidden file: $(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1/.env) (expect 404)"
          echo "faked address: $(for i in $(seq 1 14); do curl -s -o /dev/null -w '%{http_code} ' -X POST -H 'Content-Type: application/json' -H "X-Forwarded-For: 9.9.9.$i" -d '{"email":"nobody@example.com","password":"x"}' http://127.0.0.1/api/admin/login; done) (expect 401 ×10 then 429)"
          echo "open ports: $(ss -tlnH | awk '{print $4}' | sort -u | tr '\n' ' ')"
          echo "firewall: $(ufw status | grep -c ALLOW) rules · $(ufw status | head -1)"
          echo "ssh root/password: $(sshd -T 2>/dev/null | grep -E '^(permitrootlogin|passwordauthentication|maxauthtries)' | tr '\n' ' ')"
          echo "--- recent server errors"
          journalctl -u hushavia --since "-3d" --no-pager | grep -iE "error|warn|timeout|ECONN|ETIMEDOUT|unhandled|TypeError" | grep -v OTP_DEV_MODE | tail -40 | sed -E 's/(postgres:\/\/)[^ ]*/\1***/g'
          echo "--- classic bot api (fake token → expect 401 JSON)"
          curl -s "http://127.0.0.1/api/classic/bot1:aaaaaaaaaaaaaaaaaaaaaaaa/getMe"; echo
          curl -s -X POST -F chat_id=1 -F text=hi "http://127.0.0.1/api/classic/bot1:aaaaaaaaaaaaaaaaaaaaaaaa/sendMessage"; echo
          echo "--- built-in bots"
          sudo -u postgres psql -d hushavia -tAc "SELECT u.id, u.username, b.status FROM bots b JOIN users u ON u.id = b.user_id WHERE u.username IN ('BotForge','HushaviaIDBot')"
          echo "--- recent replies (type, reply target, first bytes of the target)"
          sudo -u postgres psql -d hushavia -tAc "SELECT m.id, m.chat_id, m.type, m.reply_to_id, r.type, r.sender_id, length(r.text), encode(convert_to(left(r.text, 12), 'UTF8'), 'hex'), r.meta::text FROM messages m JOIN messages r ON r.id = m.reply_to_id WHERE m.created_at > now() - interval '1 day' ORDER BY m.id DESC LIMIT 6"
          echo "--- geo lookup"
          (cd /opt/hushavia/app && node -e "const g=require('./src/utils/geo');console.log(JSON.stringify(g.lookup('39.32.0.10')))") 2>&1 | tail -2
          ls /etc/cron.d/hushavia-backup 2>&1
          echo "--- ids"
          sudo -u postgres psql -d hushavia -tAc "SELECT 'users', min(id), max(id), count(*) FROM users UNION ALL SELECT 'chats', min(id), max(id), count(*) FROM chats"
          sudo -u postgres psql -d hushavia -tAc "SELECT name, ran_at FROM hushavia_migrations"
          ls -la /var/backups/hushavia 2>/dev/null | tail -3
          echo "--- recent sessions (no tokens)"
          sudo -u postgres psql -d hushavia -tAc "SELECT id, user_id, to_char(created_at,'MM-DD HH24:MI:SS') c, to_char(revoked_at,'MM-DD HH24:MI:SS') r, to_char(last_active_at,'MM-DD HH24:MI') a, to_char(expires_at,'MM-DD') e, (fcm_token IS NOT NULL) push FROM sessions ORDER BY id DESC LIMIT 15"
          echo "--- auth requests (last 2h)"
          awk '$7 ~ /auth|logout|sessions/' /var/log/nginx/access.log 2>/dev/null | tail -30 | awk '{print $4, $6, $7, $9}'
          echo "--- nginx slow / failed requests"
          awk '$9>=500' /var/log/nginx/access.log 2>/dev/null | tail -10
          tail -5 /var/log/nginx/error.log 2>/dev/null
          rm -f /root/diagnose.js
          REMOTE
          sed -i "s/${HOST//./\\.}/<server-ip>/g" diag.txt
      - name: Save result
        if: always()
        run: |
          mkdir -p out && cp diag.txt out/diagnose.txt 2>/dev/null || echo "no output" > out/diagnose.txt
          echo "sha=${{ github.sha }}" > out/status.txt
          cd out && git init -q -b ci-deploy && git config user.name ci && git config user.email ci@users.noreply.github.com
          git add -A && git commit -qm "diagnose ${{ github.sha }}" && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-deploy
