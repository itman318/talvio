# Checks the live server: endpoint timings, recent errors, outside connectivity. Result → ci-deploy branch (diagnose.txt).
name: Diagnose server

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Run checks on the server
        env:
          SSHPASS: ${{ secrets.SERVER_PASSWORD }}
          HOST: ${{ secrets.SERVER_HOST || vars.SERVER_HOST }}
          API_BASE: ${{ vars.API_BASE }}
        run: |
          HOST=$(echo "$HOST" | sed -E 's#^https?://##; s#[/:].*$##; s/[[:space:]]//g')
          if ! echo "$HOST" | grep -Eq '^[0-9]{1,3}(\.[0-9]{1,3}){3}$'; then HOST=$(echo "$API_BASE" | sed -E 's#^https?://##; s#[/:].*$##; s/[[:space:]]//g'); fi
          sudo apt-get install -y -qq sshpass >/dev/null
          SSH_OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=20 -o LogLevel=ERROR"
          sshpass -e scp $SSH_OPTS .github/scripts/diagnose.js root@"$HOST":/root/diagnose.js
          echo "from GitHub (US): health $(curl -s -o /dev/null -w '%{time_total}s' "http://$HOST/health")" > diag.txt
          sshpass -e ssh $SSH_OPTS root@"$HOST" 'bash -s' >> diag.txt 2>&1 <<'REMOTE'
          echo "--- server"
          uptime; free -m | head -2; df -h / | tail -1
          echo "--- outbound (DNS + https)"
          for h in api.brevo.com fcm.googleapis.com www.google.com; do
            echo "$h: $(curl -s -o /dev/null -w 'dns %{time_namelookup}s total %{time_total}s code %{http_code}' --max-time 15 https://$h/ || echo FAILED)"
          done
          echo "--- local endpoint timings"
          node /root/diagnose.js
          echo "--- push notifications"
          journalctl -u talvio --since "-2d" --no-pager | grep -i "push notifications" | tail -3
          echo "--- recent server errors"
          journalctl -u talvio --since "-6h" --no-pager | grep -iE "error|warn|timeout|ECONN|ETIMEDOUT" | grep -v OTP_DEV_MODE | tail -25 | sed -E 's/(postgres:\/\/)[^ ]*/\1***/g'
          echo "--- nginx slow / failed requests"
          awk '$9>=500' /var/log/nginx/access.log 2>/dev/null | tail -10
          tail -5 /var/log/nginx/error.log 2>/dev/null
          rm -f /root/diagnose.js
          REMOTE
          sed -i "s/${HOST//./\\.}/<server-ip>/g" diag.txt
      - name: Save result
        if: always()
        run: |
          mkdir -p out && cp diag.txt out/diagnose.txt 2>/dev/null || echo "no output" > out/diagnose.txt
          echo "sha=${{ github.sha }}" > out/status.txt
          cd out && git init -q -b ci-deploy && git config user.name ci && git config user.email ci@users.noreply.github.com
          git add -A && git commit -qm "diagnose ${{ github.sha }}" && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-deploy
