# In-app updates: after every Android build, the APKs go to our own server
# (/var/lib/hushavia/downloads, served at /download/…) with latest.json — phones never need GitHub.
# Also runnable by hand: Actions → "APK to server" → Run workflow.
name: APK to server

on:
  push:
    branches: [release/restore-update-384]
    paths: ['.github/workflows/apk-to-server.yml']

permissions:
  contents: read

concurrency:
  group: apk-to-server
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 48
    steps:
      - name: Get the newest APKs (android-dfddac8 release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          R="${{ github.repository }}"
          for attempt in $(seq 1 80); do
            if gh release view android-dfddac8 -R "$R" --json body -q .body 2>/dev/null | grep -Fq 'signing: release'; then break; fi
            sleep 30
          done
          gh release view android-dfddac8 -R "$R" --json body -q .body | grep -Fq 'signing: release'
          TITLE=$(gh release view android-dfddac8 -R "$R" --json name -q .name)
          N=$(echo "$TITLE" | grep -oE '#[0-9]+' | tr -d '#')
          [ -n "$N" ] || { echo "no build number in: $TITLE"; exit 1; }
          [ "$N" = 384 ]
          echo "N=$N" >> "$GITHUB_ENV"
          mkdir dl
          gh release download android-dfddac8 -R "$R" -p hushavia.apk -p hushavia-arm32.apk -D dl
          mv dl/hushavia.apk "dl/hushavia-$N.apk"
          mv dl/hushavia-arm32.apk "dl/hushavia-arm32-$N.apk"
          python3 - "$N" <<'PY'
          import hashlib, json, os, sys, datetime
          n = int(sys.argv[1])
          def info(f):
              p = os.path.join('dl', f)
              return {'file': f, 'size': os.path.getsize(p), 'sha256': hashlib.sha256(open(p, 'rb').read()).hexdigest()}
          data = {
              'build': n,
              'published_at': datetime.datetime.utcnow().replace(microsecond=0).isoformat() + 'Z',
              'files': {'hushavia.apk': info(f'hushavia-{n}.apk'), 'hushavia-arm32.apk': info(f'hushavia-arm32-{n}.apk')},
          }
          json.dump(data, open('dl/latest.json', 'w'), indent=1)
          print(json.dumps(data, indent=1))
          PY

      - name: Upload to the server
        env:
          SSHPASS: ${{ secrets.SERVER_PASSWORD }}
          HOST: ${{ secrets.SERVER_HOST || vars.SERVER_HOST }}
          API_BASE: ${{ vars.API_BASE }}
        run: |
          set -e
          HOST=$(echo "$HOST" | sed -E 's#^https?://##; s#[/:].*$##; s/[[:space:]]//g')
          if ! echo "$HOST" | grep -Eq '^[0-9]{1,3}(\.[0-9]{1,3}){3}$'; then HOST=$(echo "$API_BASE" | sed -E 's#^https?://##; s#[/:].*$##; s/[[:space:]]//g'); fi
          sudo apt-get install -y -qq sshpass >/dev/null
          O="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=20 -o LogLevel=ERROR"
          D=/var/lib/hushavia/downloads
          sshpass -e ssh $O root@"$HOST" "mkdir -p $D"
          active=$(sshpass -e ssh $O root@"$HOST" "cat $D/latest.json" | jq -er .build)
          echo "Server build before repair: $active"
          (( active <= N ))
          # the APKs first, latest.json last: phones only hear about a build once its files are there
          sshpass -e scp $O dl/*.apk root@"$HOST":$D/
          sshpass -e scp $O dl/latest.json root@"$HOST":$D/latest.json.new
          sshpass -e ssh $O root@"$HOST" "cd $D && chmod 644 latest.json.new hushavia-$N.apk hushavia-arm32-$N.apk && mv latest.json.new latest.json"
      - name: Verify public in-app update and downloads
        run: |
          set -e
          for abi in arm64-v8a armeabi-v7a; do
            data=$(curl -fsS --retry 3 "https://hushavia.com/api/app/update?build=382&abi=$abi&fresh=1")
            echo "$data" | jq -e '.update == true and .latest_build == 384'
            url=$(echo "$data" | jq -r .url)
            [[ "$url" == https://hushavia.com/download/* ]]
            expected=$(echo "$data" | jq -r .sha256)
            actual=$(curl -fsS --retry 3 "$url" | sha256sum | cut -d' ' -f1)
            test "$actual" = "$expected"
          done
          curl -fsS 'https://hushavia.com/api/app/update?build=384&abi=arm64-v8a' | jq -e '.update == false and .latest_build == 384'
