# Puts the backend (API + Socket.IO + web app + admin panel) on your VPS and keeps it updated.
# Needs repo secrets: SERVER_HOST (IP), SERVER_PASSWORD (root password).
# Optional secrets: ADMIN_EMAIL + ADMIN_PASSWORD (10+ characters) to create the admin-panel login.
# Run it from Actions → Deploy → Run workflow. The short result goes to the ci-deploy branch (no secrets).
name: Deploy

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Check secrets
        env:
          HOST: ${{ secrets.SERVER_HOST || vars.SERVER_HOST }}
          API_BASE: ${{ vars.API_BASE }}
          PASS: ${{ secrets.SERVER_PASSWORD }}
          AE: ${{ secrets.ADMIN_EMAIL }}
          AP: ${{ secrets.ADMIN_PASSWORD }}
          API: ${{ vars.API_BASE }}
        run: |
          # only which settings exist is reported, never their values
          {
            echo "SERVER_HOST: $([ -n "$HOST" ] && echo set || echo MISSING)"
            echo "SERVER_PASSWORD: $([ -n "$PASS" ] && echo set || echo MISSING)"
            echo "ADMIN_EMAIL: $([ -n "$AE" ] && echo set || echo missing)"
            echo "ADMIN_PASSWORD: $([ -n "$AP" ] && echo "set (${#AP} characters)" || echo missing)"
            echo "API_BASE variable: $([ -n "$API" ] && echo set || echo missing)"
          } | tee deploy.txt
          [ -n "$HOST" ] && [ -n "$PASS" ]

      - name: Package the backend
        run: |
          tar -czf talvio-backend.tgz -C backend --exclude=node_modules --exclude=uploads --exclude=test --exclude=.env .
          ls -la talvio-backend.tgz

      - name: Upload and set up the server
        id: setup
        env:
          SSHPASS: ${{ secrets.SERVER_PASSWORD }}
          HOST: ${{ secrets.SERVER_HOST || vars.SERVER_HOST }}
          API_BASE: ${{ vars.API_BASE }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          HOST=$(echo "$HOST" | sed -E 's#^https?://##; s#[/:].*$##; s/[[:space:]]//g')
          if ! echo "$HOST" | grep -Eq '^[0-9]{1,3}(\.[0-9]{1,3}){3}$'; then HOST=$(echo "$API_BASE" | sed -E 's#^https?://##; s#[/:].*$##; s/[[:space:]]//g'); fi
          sudo apt-get install -y -qq sshpass >/dev/null
          SSH_OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=20 -o ServerAliveInterval=30 -o LogLevel=ERROR"
          set -o pipefail
          echo "port 22 (ssh): $(timeout 10 bash -c "</dev/tcp/$HOST/22" 2>/dev/null && echo open || echo CLOSED)" | tee -a deploy.txt
          # first login after Hetzner sets a root password asks to change it: answer that once
          probe=$(sshpass -e ssh $SSH_OPTS root@"$HOST" 'echo LOGIN_OK' 2>&1 || true)
          if ! echo "$probe" | grep -q LOGIN_OK; then
            if echo "$probe" | grep -qi "permission denied"; then
              echo "login: the root password was not accepted (check SERVER_PASSWORD)" | tee -a deploy.txt; exit 1
            fi
            echo "login: password must be renewed first — doing it now" | tee -a deploy.txt
            sudo apt-get install -y -qq expect >/dev/null
            TEMP_PASS="T$(head -c 24 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | head -c 20)9!" HOST="$HOST" \
              expect .github/scripts/root-password-renew.exp > renew.log 2>&1 || true
            grep -o 'RENEW[_: ].*' renew.log | grep -v "chpasswd" | tail -3 | tee -a deploy.txt
            probe=$(sshpass -e ssh $SSH_OPTS root@"$HOST" 'echo LOGIN_OK' 2>&1 || true)
            echo "login after renewal: $(echo "$probe" | grep -q LOGIN_OK && echo ok || echo still failing)" | tee -a deploy.txt
          else
            echo "login: ok" | tee -a deploy.txt
          fi
          if ! sshpass -e scp $SSH_OPTS talvio-backend.tgz .github/scripts/server-setup.sh root@"$HOST":/root/ 2>scp.err; then
            echo "upload failed: $(head -c 400 scp.err | tr '\n' ' ')" | tee -a deploy.txt
            grep -qi "permission denied" scp.err && echo "→ the root password was not accepted (check SERVER_PASSWORD)" | tee -a deploy.txt
            exit 1
          fi
          echo "upload: ok" | tee -a deploy.txt
          {
            printf 'export ADMIN_EMAIL=%q ADMIN_PASSWORD=%q\n' "$ADMIN_EMAIL" "$ADMIN_PASSWORD"
            echo 'bash /root/server-setup.sh'
          } | sshpass -e ssh $SSH_OPTS root@"$HOST" 'bash -s' 2>&1 | tee -a deploy.txt

      - name: Check from outside
        if: always()
        env:
          HOST: ${{ secrets.SERVER_HOST || vars.SERVER_HOST }}
          API_BASE: ${{ vars.API_BASE }}
        run: |
          HOST=$(echo "$HOST" | sed -E 's#^https?://##; s#[/:].*$##; s/[[:space:]]//g')
          if ! echo "$HOST" | grep -Eq '^[0-9]{1,3}(\.[0-9]{1,3}){3}$'; then HOST=$(echo "$API_BASE" | sed -E 's#^https?://##; s#[/:].*$##; s/[[:space:]]//g'); fi
          echo "outside health: $(curl -fsS --max-time 15 "http://$HOST/health" || echo FAILED)" | tee -a deploy.txt

      - name: Save result to ci-deploy branch
        if: always()
        env:
          HOST: ${{ secrets.SERVER_HOST || vars.SERVER_HOST }}
          API_BASE: ${{ vars.API_BASE }}
        run: |
          mkdir -p out
          HOST=$(echo "$HOST" | sed -E 's#^https?://##; s#[/:].*$##; s/[[:space:]]//g')
          if ! echo "$HOST" | grep -Eq '^[0-9]{1,3}(\.[0-9]{1,3}){3}$'; then HOST=$(echo "$API_BASE" | sed -E 's#^https?://##; s#[/:].*$##; s/[[:space:]]//g'); fi
          # never publish the address or any secret: mask the IP
          report="$(cat deploy.txt 2>/dev/null || echo 'no report')"
          if [ -n "$HOST" ]; then report="${report//"$HOST"/<server-ip>}"; fi
          printf '%s\n' "$report" > out/deploy.txt
          echo "host looks like an IPv4 address: $(echo "$HOST" | grep -Eq '^[0-9]{1,3}(\.[0-9]{1,3}){3}$' && echo yes || echo no)" >> out/deploy.txt
          echo "sha=${{ github.sha }} result=${{ steps.setup.outcome }}" > out/status.txt
          cd out
          git init -q -b ci-deploy
          git config user.name ci && git config user.email ci@users.noreply.github.com
          git add -A && git commit -qm "deploy ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-deploy
