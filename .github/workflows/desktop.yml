# Builds Hushavia for computers: Windows (.zip), Linux (.tar.gz) and macOS (.zip), from the same Flutter code
# as the phone app. Run it by hand from the Actions tab. Files go to the "desktop-latest" release;
# a report (build logs + a Linux start-up screenshot) goes to the ci-desktop branch.
name: Desktop apps

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: Which ones (windows,linux,macos)
        default: windows,linux,macos

permissions:
  contents: write

env:
  API_BASE_RAW: ${{ vars.API_BASE || 'http://127.0.0.1:4000' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: mobile
    steps:
      - name: Skip?
        id: want
        working-directory: .
        run: |
          case ",${{ inputs.platforms }}," in *,${{ matrix.platform }},*) echo "go=1" >> $GITHUB_OUTPUT ;; *) echo "go=0" >> $GITHUB_OUTPUT ;; esac

      - uses: actions/checkout@v5
        if: steps.want.outputs.go == '1'

      - uses: subosito/flutter-action@v2
        if: steps.want.outputs.go == '1'
        with:
          channel: stable
          cache: true

      - name: Linux build tools
        if: steps.want.outputs.go == '1' && matrix.platform == 'linux'
        working-directory: .
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build cmake clang pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libsecret-1-dev libjsoncpp-dev libnotify-dev libayatana-appindicator3-dev libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev xvfb imagemagick x11-apps pulseaudio >/dev/null

      - name: Generate the ${{ matrix.platform }} project
        if: steps.want.outputs.go == '1'
        run: |
          flutter config --enable-${{ matrix.platform }}-desktop
          flutter create . --org com.hushavia --project-name chatapp --platforms=${{ matrix.platform }}
          rm -f test/widget_test.dart
          # window title and app name: Hushavia
          # the program is called Hushavia(.exe), not chatapp
          for c in windows/CMakeLists.txt linux/CMakeLists.txt; do
            [ -f "$c" ] && sed -i 's/set(BINARY_NAME "chatapp")/set(BINARY_NAME "Hushavia")/' "$c"
          done
          if [ -f windows/runner/main.cpp ]; then
            sed -i 's/L"chatapp"/L"Hushavia"/' windows/runner/main.cpp
            sed -i 's/Size size(1280, 720)/Size size(1100, 760)/' windows/runner/main.cpp
            sed -i 's/"FileDescription", "chatapp"/"FileDescription", "Hushavia"/; s/"ProductName", "chatapp"/"ProductName", "Hushavia"/' windows/runner/Runner.rc || true
            # app icon
            # app icon: the Hushavia mark (from branding/), all Windows sizes in one .ico
            python -m pip install -q pillow >/dev/null 2>&1 || true
            python -c "from PIL import Image; Image.open('branding/store/icon-512.png').save('windows/runner/resources/app_icon.ico', sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])" || echo "icon: kept the default"
          fi
          if [ -f linux/runner/my_application.cc ]; then
            sed -i 's/"chatapp"/"Hushavia"/g; s/gtk_window_set_default_size(window, 1280, 720)/gtk_window_set_default_size(window, 1100, 760)/' linux/runner/my_application.cc
          fi
          if [ -f macos/Runner/Configs/AppInfo.xcconfig ]; then
            sed -i '' 's/^PRODUCT_NAME = .*/PRODUCT_NAME = Hushavia/' macos/Runner/Configs/AppInfo.xcconfig
            # app icon: the Hushavia mark in every macOS size
            SET=macos/Runner/Assets.xcassets/AppIcon.appiconset
            for n in 16 32 64 128 256 512 1024; do sips -z $n $n branding/store/icon-512.png --out "$SET/app_icon_$n.png" >/dev/null 2>&1 || true; done
            # the app talks to the network, uses the mic and the camera (calls)
            for f in macos/Runner/DebugProfile.entitlements macos/Runner/Release.entitlements; do
              /usr/libexec/PlistBuddy -c "Add :com.apple.security.network.client bool true" "$f" || true
              /usr/libexec/PlistBuddy -c "Add :com.apple.security.device.audio-input bool true" "$f" || true
              /usr/libexec/PlistBuddy -c "Add :com.apple.security.device.camera bool true" "$f" || true
              /usr/libexec/PlistBuddy -c "Add :com.apple.security.files.user-selected.read-write bool true" "$f" || true
            done
            /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string 'Hushavia uses the microphone for calls and voice messages.'" macos/Runner/Info.plist || true
            /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'Hushavia uses the camera for video calls.'" macos/Runner/Info.plist || true
            sed -i '' "s/platform :osx, '[0-9.]*'/platform :osx, '10.15'/" macos/Podfile || true
            sed -i '' 's/MACOSX_DEPLOYMENT_TARGET = 10.14;/MACOSX_DEPLOYMENT_TARGET = 10.15;/g' macos/Runner.xcodeproj/project.pbxproj || true
          fi
          flutter pub get
          # phone-only plugins whose desktop part doesn't compile: hide that platform from Flutter
          python3 tool/desktop_skip_plugins.py ${{ matrix.platform }} no_screenshot || python tool/desktop_skip_plugins.py ${{ matrix.platform }} no_screenshot

      - name: Build
        id: build
        if: steps.want.outputs.go == '1'
        continue-on-error: true
        env:
          CMAKE_POLICY_VERSION_MINIMUM: '3.5' # Firebase's Windows SDK still asks for an old CMake
          CL: -D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS # local_auth_windows (Windows Hello) on the newest Visual Studio
        run: |
          mkdir -p ../ci-report
          API="$(echo "$API_BASE_RAW" | tr -d '[:space:]' | sed -E 's#/[0-9]{1,3}$##; s#/+$##')"
          case "$API" in http://*|https://*) ;; *) API="http://$API" ;; esac
          set -o pipefail
          flutter build ${{ matrix.platform }} --release --dart-define=API_BASE=$API --dart-define=APP_VERSION=1.1.${{ github.run_number }} --build-name=1.1.${{ github.run_number }} --build-number=${{ github.run_number }} 2>&1 | tail -300 | tee ../ci-report/build-${{ matrix.platform }}.txt

      - name: Linux start-up check (screenshot)
        if: steps.build.outcome == 'success' && matrix.platform == 'linux'
        continue-on-error: true
        run: |
          B=build/linux/x64/release/bundle
          Xvfb :99 -screen 0 1280x900x24 >/dev/null 2>&1 &
          # a pretend speaker + microphone (calls need an audio device)
          pulseaudio -D --exit-idle-time=-1 --system=false || true
          pactl load-module module-null-sink sink_name=fake >/dev/null 2>&1 || true
          pactl load-module module-virtual-source source_name=fakemic master=fake.monitor >/dev/null 2>&1 || true
          sleep 2
          DISPLAY=:99 timeout 40 $B/Hushavia > ../ci-report/run-linux.txt 2>&1 &
          sleep 30
          DISPLAY=:99 import -window root ../ci-report/linux-start.png || true
          sleep 12
          tail -80 ../ci-report/run-linux.txt || true

      - name: Package
        id: pkg
        if: steps.build.outcome == 'success'
        run: |
          mkdir -p ../dist
          case "${{ matrix.platform }}" in
            windows)
              # the Visual C++ runtime next to the app, so it starts on a PC that never installed it
              for d in msvcp140.dll vcruntime140.dll vcruntime140_1.dll; do cp "/c/Windows/System32/$d" build/windows/x64/runner/Release/ || true; done
              (cd build/windows/x64/runner/Release && 7z a -tzip ../../../../../../dist/hushavia-windows.zip . >/dev/null)
              # a normal Windows installer: Next → Install, Start menu + desktop icon, uninstall in Settings → Apps
              ISCC="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
              [ -f "$ISCC" ] || { choco install innosetup -y --no-progress >/dev/null; }
              cat > ../dist-setup.iss <<ISS
          [Setup]
          AppId={{6D4AFF00-4855-5348-4156-494131000001}
          AppName=Hushavia
          AppVersion=1.1.${{ github.run_number }}
          AppPublisher=Hushavia
          DefaultDirName={localappdata}\Programs\Hushavia
          DisableDirPage=yes
          DisableProgramGroupPage=yes
          PrivilegesRequired=lowest
          OutputDir=$(cygpath -w "$PWD/../dist")
          OutputBaseFilename=hushavia-windows-setup
          SetupIconFile=$(cygpath -w "$PWD/windows/runner/resources/app_icon.ico")
          UninstallDisplayIcon={app}\Hushavia.exe
          Compression=lzma2/max
          SolidCompression=yes
          WizardStyle=modern
          ArchitecturesInstallIn64BitMode=x64compatible
          ArchitecturesAllowed=x64compatible
          CloseApplications=yes

          [Tasks]
          Name: "desktopicon"; Description: "Create a desktop icon"; GroupDescription: "Shortcuts:"

          [Files]
          Source: "$(cygpath -w "$PWD/build/windows/x64/runner/Release")\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs

          [Icons]
          Name: "{autoprograms}\Hushavia"; Filename: "{app}\Hushavia.exe"
          Name: "{autodesktop}\Hushavia"; Filename: "{app}\Hushavia.exe"; Tasks: desktopicon

          [Run]
          Filename: "{app}\Hushavia.exe"; Description: "Open Hushavia"; Flags: nowait postinstall skipifsilent
          ISS
              sed -i 's/^          //' ../dist-setup.iss
              "$ISCC" ../dist-setup.iss | tail -5
              ;;
            linux) tar -C build/linux/x64/release -czf ../dist/hushavia-linux.tar.gz --transform 's/^bundle/hushavia/' bundle ;;
            macos) (cd build/macos/Build/Products/Release && ditto -c -k --keepParent Hushavia.app ../../../../../../dist/hushavia-macos.zip) ;;
          esac
          ls -la ../dist

      - name: Publish (desktop-latest)
        if: steps.pkg.outcome == 'success'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          R="${{ github.repository }}"
          for i in 1 2 3 4 5; do
            if gh release view desktop-latest -R "$R" >/dev/null 2>&1; then
              if gh release upload desktop-latest dist/* --clobber -R "$R"; then
                # files with the app's old name: remove them so only Hushavia files remain
                gh release view desktop-latest -R "$R" --json assets -q '.assets[].name' | grep -v '^hushavia' | while read -r old; do
                  gh release delete-asset desktop-latest "$old" -y -R "$R" || true
                done || true
                exit 0
              fi
            else
              gh release create desktop-latest dist/* -R "$R" --target "${{ github.sha }}" --prerelease \
                --title "Hushavia Desktop (test build)" --notes "Windows: run hushavia-windows-setup.exe (or unzip hushavia-windows.zip and run Hushavia.exe). Linux: extract and run hushavia/Hushavia. macOS: unzip, right-click Hushavia → Open (not signed yet)." && exit 0
            fi
            echo "retry $i"; sleep $((10 + i * 7))
          done
          exit 1

      - name: Upload report
        if: always() && steps.want.outputs.go == '1'
        continue-on-error: true # the artifact quota can be full: the apps are already published
        uses: actions/upload-artifact@v4
        with:
          name: report-${{ matrix.platform }}
          path: ci-report

  report:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ci-report
          merge-multiple: true
        continue-on-error: true
      - name: Save report to ci-desktop branch
        run: |
          mkdir -p ci-report
          echo "result=${{ needs.build.result }} sha=${{ github.sha }}" > ci-report/status.txt
          cd ci-report
          git init -q -b ci-desktop
          git config user.name ci && git config user.email ci@users.noreply.github.com
          git add -A && git commit -qm "Desktop report ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-desktop
