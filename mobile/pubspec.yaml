name: chatapp
description: Talvio messaging app for Android and iOS.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # state & networking
  provider: ^6.1.2
  http: ^1.2.2
  http_parser: ^4.0.2
  socket_io_client: ^3.1.6
  socks5_proxy: ^2.1.1 # proxy settings (SOCKS5)
  flutter_secure_storage: ^9.2.2

  # media
  image_picker: ^1.1.2 # pickMultiImage(limit:) needs ≥1.1.0
  file_picker: ^10.0.0
  record: ^6.0.0 # 5.x pulls record_linux 0.7 which no longer compiles
  just_audio: ^0.9.40
  audio_session: any # same version just_audio uses (earpiece routing)
  proximity_sensor: ^1.3.2 # voice messages: hold the phone to the ear
  google_mlkit_subject_segmentation: '>=0.1.0 <0.3.0' # sticker maker: remove the background (on the phone)
  video_player: ^2.9.1
  video_compress: ^3.1.3 # trim & shrink videos before sending
  open_filex: ^4.5.0
  mime: ^1.0.6
  path_provider: ^2.1.4

  # push notifications (optional — app works without Firebase config)
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3

  intl: ^0.19.0

  # Batch A
  shared_preferences: ^2.3.2
  flutter_contacts: ^1.1.9
  geolocator: ^13.0.1
  url_launcher: ^6.3.0
  local_auth: ^2.3.0
  crypto: ^3.0.5

  # Batch B: calls
  flutter_webrtc: ^0.12.6
  wakelock_plus: ^1.2.8
  flutter_ringtone_player: ^4.0.0+4

  # Batch C: secret chats (end-to-end encryption)
  cryptography: ^2.7.0
  no_screenshot: ^0.3.1

  # Batch D: bot mini apps
  webview_flutter: ^4.10.0

  # Batch E: link computer by QR, photo editor, auto-download
  mobile_scanner: ^5.2.3
  image: ^4.2.0
  connectivity_plus: ^6.1.0

  # Premium batch: maps for (live) locations
  flutter_map: ^7.0.2
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0
  sensors_plus: ^6.1.1
  flutter_foreground_task: ^8.17.0
  emoji_picker_flutter: ^4.3.0
  camera: ^0.11.0+2
  qr_flutter: ^4.1.0
  app_links: ^6.3.2
  archive: '>=3.6.1 <5.0.0'
  latlong2: ^0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/emoji/tali/
    - assets/mascot/
  fonts:
    - family: Jakarta
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
