name: chatapp
description: Telegram-style messaging app (Phase 1) for Android and iOS.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # state & networking
  provider: ^6.1.2
  http: ^1.2.2
  http_parser: ^4.0.2
  socket_io_client: ^3.0.2
  flutter_secure_storage: ^9.2.2

  # media
  image_picker: ^1.1.2
  file_picker: ^8.1.2
  record: ^5.1.2
  just_audio: ^0.9.40
  video_player: ^2.9.1
  open_filex: ^4.5.0
  mime: ^1.0.6
  path_provider: ^2.1.4

  # push notifications (optional — app works without Firebase config)
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3

  intl: ^0.19.0

  # Batch A
  shared_preferences: ^2.3.2
  flutter_contacts: ^1.1.9
  geolocator: ^13.0.1
  url_launcher: ^6.3.0
  local_auth: ^2.3.0
  crypto: ^3.0.5

  # Batch B: calls
  flutter_webrtc: ^0.12.6
  wakelock_plus: ^1.2.8
  flutter_ringtone_player: ^4.0.0+4

  # Batch C: secret chats (end-to-end encryption)
  cryptography: ^2.7.0
  no_screenshot: ^0.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
