  <g id="propBody"></g>

    <g class="upper"><path d="M-16 6 C-19 -16 -16 -38 -13 -48 L13 -48 C16 -38 19 -16 16 6 C9 13 -9 13 -16 6Z" fill="url(#gArm)" stroke="#D98708" stroke-width="2.3" stroke-linejoin="round"/></g>
    <g class="hand" transform="translate(0 -46)"><g class="prop"></g>
      <g class="f f0"><path d="M-7.5 0 C-10 -16 -6 -30 0 -34 C6 -30 10 -16 7.5 0Z" fill="url(#gArm)" stroke="#D98708" stroke-width="2.3" stroke-linejoin="round"/></g>
      <g class="f f1"><path d="M-8 0 C-10.5 -18 -6 -34 0 -38 C6 -34 10.5 -18 8 0Z" fill="url(#gArm)" stroke="#D98708" stroke-width="2.3" stroke-linejoin="round"/></g>
      <g class="f f2"><path d="M-7.5 0 C-10 -16 -6 -30 0 -34 C6 -30 10 -16 7.5 0Z" fill="url(#gArm)" stroke="#D98708" stroke-width="2.3" stroke-linejoin="round"/></g>
      <g class="f f3"><path d="M-6.5 0 C-9 -12 -5 -22 0 -25 C5 -22 9 -12 6.5 0Z" fill="url(#gArm)" stroke="#D98708" stroke-width="2.3" stroke-linejoin="round"/></g>
      <ellipse cx="0" cy="-8" rx="18.5" ry="17" fill="url(#gArm)" stroke="#D98708" stroke-width="2.3"/>

    <g class="upper"><path d="M-16 6 C-19 -16 -16 -38 -13 -48 L13 -48 C16 -38 19 -16 16 6 C9 13 -9 13 -16 6Z" fill="url(#gArm)" stroke="#D98708" stroke-width="2.3" stroke-linejoin="round"/></g>
    <g class="hand" transform="translate(0 -46)"><g class="prop"></g>
      <g class="f f0"><path d="M-7.5 0 C-10 -16 -6 -30 0 -34 C6 -30 10 -16 7.5 0Z" fill="url(#gArm)" stroke="#D98708" stroke-width="2.3" stroke-linejoin="round"/></g>
      <g class="f f1"><path d="M-8 0 C-10.5 -18 -6 -34 0 -38 C6 -34 10.5 -18 8 0Z" fill="url(#gArm)" stroke="#D98708" stroke-width="2.3" stroke-linejoin="round"/></g>
      <g class="f f2"><path d="M-7.5 0 C-10 -16 -6 -30 0 -34 C6 -30 10 -16 7.5 0Z" fill="url(#gArm)" stroke="#D98708" stroke-width="2.3" stroke-linejoin="round"/></g>
      <g class="f f3"><path d="M-6.5 0 C-9 -12 -5 -22 0 -25 C5 -22 9 -12 6.5 0Z" fill="url(#gArm)" stroke="#D98708" stroke-width="2.3" stroke-linejoin="round"/></g>
      <ellipse cx="0" cy="-8" rx="18.5" ry="17" fill="url(#gArm)" stroke="#D98708" stroke-width="2.3"/>

<script>
const $=id=>document.getElementById(id);
let DUR=3.0;
const ease={ lin:x=>x, io:x=>x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2, out:x=>1-Math.pow(1-x,3), in:x=>x*x*x,
  back:x=>{const c=1.70158,c3=c+1;return 1+c3*Math.pow(x-1,3)+c*Math.pow(x-1,2)} };
function kf(t,k){ if(t<=k[0][0])return k[0][1]; for(let i=1;i<k.length;i++){ if(t<=k[i][0]){const a=k[i-1],b=k[i];const u=(t-a[0])/(b[0]-a[0]);return a[1]+(b[1]-a[1])*(ease[b[2]||'io'])(u);} } return k[k.length-1][1]; }
const T=(el,s)=>el.setAttribute('transform',s);
const O=(el,o)=>el.setAttribute('opacity',o);
const sin=(t,hz,ph=0)=>Math.sin(t*Math.PI*2*hz+ph);
const pulse=(t,t0,d)=>{const u=(t-t0)/d;return u>0&&u<1?Math.sin(u*Math.PI):0;};
const blinkAt=(t,...ts)=>Math.max(0,...ts.map(b=>pulse(t,b,.16)));
const STAR='M0 -18 C2 -5 5 -2 18 0 C5 2 2 5 0 18 C-2 5 -5 2 -18 0 C-5 -2 -2 -5 0 -18Z';
const starEl=(id,gold)=>`<path id="${id}" d="${STAR}" fill="${gold?'url(#gStar)':'#B9AEFF'}" stroke="${gold?'#E79A00':'#6A55F5'}" stroke-width="1.5" opacity="0"/>`;
function star(id,x,y,t,t0,s0,rot){const el=$(id);const u=(t-t0)/.7;const on=u>0&&u<1;T(el,`translate(${x} ${y-(on?u*26:0)}) rotate(${u*rot}) scale(${on?Math.sin(u*Math.PI)*s0:0})`);O(el,on?1:0);}

// ---- the puppet: one set of numbers per frame
function pose(p){
  p=Object.assign({x:0,y:0,sy:1,hy:0,tilt:0,capY:0,capR:0,aR:[150,36,.35],aL:[150,36,.35],shrug:0,lift:0,brow:null,blink:0,lookX:0,lookY:0,open:0,eyes:'open',wl:0,eyeS:1,feet:0},p);
  const sx=1/Math.sqrt(p.sy);
  T($('stage'),`translate(${240+p.x} ${478-p.lift}) scale(.9) translate(-256 -470)`);
  T($('root'),`translate(0 ${p.y}) translate(256 456) scale(${sx} ${p.sy}) translate(-256 -456)`);
  const h=Math.min(1,-p.y/44);
  T($('shadow'),`translate(256 462) scale(${(1-h*.32)*(.96+(sx-1)*1.2)} ${1-h*.3}) translate(-256 -462)`); O($('shadow'),.2-h*.08);
  const tuck=h*10+p.feet; T($('footL'),`translate(${tuck*.4} ${-tuck}) rotate(${h*14} 212 446)`); T($('footR'),`translate(${-tuck*.4} ${-tuck}) rotate(${-h*14} 300 446)`);
  const arm=(id,[A,B,S])=>{const g=$(id);T(g.querySelector('.rot'),`rotate(${A})`);T(g.querySelector('.hand'),`translate(0 -46) rotate(${B})`);
    const an=[-34,-2,30,-78];g.querySelectorAll('.f').forEach((el,i)=>T(el,`translate(${i==3?-12:0} ${i==3?-4:-14}) rotate(${an[i]*S})`));};
  arm('armR',p.aR); arm('armL',p.aL);
  T($('armR'),`translate(338 ${372-p.shrug}) scale(1.2)`); T($('armL'),`translate(174 ${372-p.shrug}) scale(1.2)`);
  T($('head'),`translate(0 ${p.hy}) rotate(${p.tilt} 256 340)`);
  T($('cap'),`translate(0 ${p.capY}) rotate(${p.capR} 256 200)`);
  T($('tuft'),`rotate(${p.wl} 352 212)`);
  const closed=p.eyes!=='open'||p.blink>.85; const es=(1-p.blink*.92)*p.eyeS;
  for(const [id,cx] of [['eyeL',208],['eyeR',304]]){T($(id),`translate(${p.lookX} ${p.lookY}) translate(${cx} 264) scale(1 ${es}) translate(${-cx} -264)`);O($(id),closed?0:1);}
  O($('lids'),(p.eyes==='happy'||(p.eyes==='open'&&p.blink>.85))?1:0); O($('lidsSleep'),p.eyes==='sleep'?1:0);
  T($('lids'),`translate(${p.lookX} ${p.lookY})`);
  // heavy lids: brow = [angle, drop 0..1] — positive angle = angry (inner corners down), negative = sad
  O($('brow'),p.brow&&!closed?1:0);
  if(p.brow){const [ang,drop]=p.brow;T($('browL'),`translate(208 ${239+drop*24}) rotate(${ang})`);T($('browR'),`translate(304 ${239+drop*24}) rotate(${-ang})`);}
  T($('jaw'),`translate(0 ${-10+p.open*13}) translate(256 300) scale(1 ${.2+p.open*.9}) translate(-256 -300)`); O($('jaw'),p.open<.03?0:1);
}
const breath=t=>sin(t,2/3)*.012;
const hop=(t,t0,amp=44)=>{ // squash → jump → land → settle, starting at t0
  const u=t-t0;
  return {y:kf(u,[[0,0],[.34,0],[.56,-amp,'out'],[.80,0,'in'],[9,0]]),
    sy:kf(u,[[0,1],[.20,.90],[.34,.86],[.46,1.13,'out'],[.62,1.04],[.80,1.06,'in'],[.90,.84,'out'],[1.04,1.07],[1.18,.97],[1.32,1],[9,1]]),
    hy:kf(u,[[0,0],[.20,5],[.34,8],[.50,-8,'out'],[.86,-2],[.96,9,'out'],[1.16,-3],[1.34,0],[9,0]]),
    capY:kf(u,[[0,0],[.34,2],[.52,5,'out'],[.70,-9,'out'],[.92,-12],[1.04,6,'out'],[1.22,-2],[1.4,0],[9,0]]),
    capR:kf(u,[[0,0],[.5,-2],[.96,3,'out'],[1.2,-1.5],[1.4,0],[9,0]]), land:pulse(u,.84,.2)};
};

const SCENES={};

// ---------------------------------------------------------------- hello
SCENES.wave={init(){ $('fx').innerHTML=`<g fill="none" stroke="#7C6BFF" stroke-width="7" stroke-linecap="round" transform="translate(-2 40)"><path id="a1" d="M438 250 Q456 272 446 298"/><path id="a2" d="M462 232 Q490 272 470 314"/></g>`+starEl('s1',1)+starEl('s2',0)+starEl('s3',1); },
 draw(t){ const j=hop(t,0);
  const up=kf(t,[[0,0],[.30,0],[.62,1,'back'],[2.30,1],[2.72,0],[3,0]]);
  const env=kf(t,[[.6,0],[.78,1,'out'],[2.1,1],[2.36,0]]); const on=t>.6&&t<2.36;
  const wv=on?sin(t-.6,2.6)*env:0, lag=on?sin(t-.6,2.6,-.9)*env:0;
  const la=kf(t,[[0,152],[.34,158],[.52,100,'out'],[.86,160],[1.1,148],[1.4,152],[3,152]]);
  pose({y:j.y,sy:j.sy+breath(t),hy:j.hy,capY:j.capY,capR:j.capR-wv*1.2,wl:-wv*9,
    tilt:kf(t,[[0,0],[.34,-3],[.70,7,'out'],[2.3,7],[2.75,0],[3,0]])+wv*2.2,
    aR:[(1-up)*152+up*60+wv*8,(1-up)*30+up*-22+lag*26,.4+up*.7+Math.abs(lag)*.12],
    aL:[la,kf(t,[[0,30],[.52,-14,'out'],[.9,36],[1.3,30],[3,30]]),.4+(152-la)/150*.7],
    blink:Math.max(j.land,blinkAt(t,1.5,2.62)),lookX:up*3,
    open:kf(t,[[0,0],[.44,0],[.60,1,'back'],[1.0,.75],[1.3,1],[1.7,.7],[2.0,.95],[2.3,.2],[2.5,0],[3,0]])});
  const arc=(el,d)=>{const p=((t-.7-d)%0.52)/0.52;const o=t>.7+d&&t<2.3;O(el,o?Math.sin(Math.max(0,p)*Math.PI)*.85:0);T(el,`translate(${o?p*10:0} ${o?-p*6:0})`);};
  arc($('a1'),0);arc($('a2'),.12); star('s1',104,150,t,.52,1.15,90);star('s2',86,300,t,.66,.8,-70);star('s3',418,150,t,.60,.7,60); }};

// ---------------------------------------------------------------- search: looks around through a magnifier
const MAG=`<g transform="translate(0 -6) scale(1.45)"><rect x="-5.5" y="-34" width="11" height="40" rx="5.5" fill="#3F2BC9" stroke="#231680" stroke-width="2.2"/>
 <circle cx="0" cy="-58" r="27" fill="#BFE9FF" fill-opacity=".55" stroke="#2A1B8F" stroke-width="2.2"/><circle cx="0" cy="-58" r="24" fill="none" stroke="#7C6BFF" stroke-width="6"/>
 <circle cx="0" cy="-58" r="20.5" fill="none" stroke="#fff" stroke-width="1.6" opacity=".6"/><path d="M-13 -66 Q-8 -76 3 -77" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round" opacity=".9"/></g>`;
SCENES.search={init(){ $('armR').querySelector('.prop').innerHTML=MAG; $('fx').innerHTML=starEl('s1',1)+starEl('s2',0); },
 draw(t){ const sw=kf(t,[[0,0],[.5,-1,'io'],[1.3,-1],[1.9,1,'io'],[2.6,1],[3,0,'io']]); // -1 = looking left, 1 = right
  const bob=sin(t,2)*.5;
  pose({sy:1+breath(t)+Math.abs(sw)*-.02,x:sw*5,hy:2+bob,tilt:sw*6,capR:-sw*2+sin(t,2,-.8)*.8,capY:bob*-1.2,wl:sw*6,
