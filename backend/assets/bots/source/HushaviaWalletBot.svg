<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
 <defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3FD8C0"/><stop offset="1" stop-color="#5B3CEB"/></linearGradient>
  <linearGradient id="wal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E6E1FF"/></linearGradient>
  <linearGradient id="flap" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2B2350"/><stop offset="1" stop-color="#0F0E2A"/></linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFE08A"/><stop offset="0.55" stop-color="#F5B544"/><stop offset="1" stop-color="#D98E12"/></linearGradient>
 </defs>
 <rect width="512" height="512" fill="url(#bg)"/>
 <circle cx="430" cy="90" r="130" fill="#FFFFFF" opacity="0.10"/>
 <circle cx="70" cy="450" r="110" fill="#FFFFFF" opacity="0.08"/>
 <!-- coin peeking out -->
 <circle cx="320" cy="150" r="62" fill="url(#gold)" stroke="#B87708" stroke-width="7"/>
 <circle cx="320" cy="150" r="44" fill="none" stroke="#FFF2B0" stroke-width="5" opacity="0.7"/>
 <text x="320" y="174" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="66" fill="#7A4B00" text-anchor="middle">H</text>
 <!-- wallet body -->
 <rect x="104" y="184" width="304" height="212" rx="40" fill="url(#wal)"/>
 <rect x="104" y="184" width="304" height="52" rx="26" fill="#CFC3FF" opacity="0.55"/>
 <!-- clasp -->
 <rect x="300" y="256" width="132" height="84" rx="34" fill="url(#flap)"/>
 <circle cx="346" cy="298" r="15" fill="#5EF0D2"/>
 <circle cx="341" cy="293" r="5" fill="#FFFFFF" opacity="0.8"/>
</svg>
